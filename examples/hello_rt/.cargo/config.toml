[build]
target = "riscv32imc-unknown-none-elf"

[target.riscv32imc-unknown-none-elf]
rustflags = [
    "-C",
    "linker=riscv64-unknown-elf-gcc",
    "-C",
    "link-arg=-march=rv32imc",
    "-C",
    "link-arg=-mabi=ilp32",
    "-C",
    "link-arg=-Wl,-Tmemory.x",
    "-C",
    "link-arg=-Wl,-Tlink.x",
    "-C",
    "link-arg=-nostartfiles",
]
runner = "riscv32-unknown-elf-gdb -q -x ../../fpga/utils/connect-and-load.gdb"

